name: Probe ticket times (diagnostic)

# One-off diagnostic. Runs when the probe files are pushed, or on demand. Does
# NOT deploy. Safe to delete after reading the logs.
on:
  push:
    branches:
      - claude/toast-pos-weekly-reports-nft91i
    paths:
      - "scripts/probe_statuses.py"
      - ".github/workflows/probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "probe-fishshops"
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run probe
        env:
          PYTHONPATH: src
          TOAST_API_HOST: ${{ secrets.TOAST_API_HOST }}
          TOAST_CLIENT_ID: ${{ secrets.TOAST_CLIENT_ID }}
          TOAST_CLIENT_SECRET: ${{ secrets.TOAST_CLIENT_SECRET }}
          TOAST_USER_ACCESS_TYPE: ${{ secrets.TOAST_USER_ACCESS_TYPE }}
          TOAST_RESTAURANT_GUIDS: ${{ secrets.TOAST_RESTAURANT_GUIDS }}
        run: python scripts/probe_statuses.py
