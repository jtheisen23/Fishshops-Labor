name: Weekly Toast Report

# Runs every Monday at 13:00 UTC (adjust to your timezone), on every push to the
# default branch, and on demand. Deploys the dashboard to Cloudflare Pages, which
# is protected by Cloudflare Access (email login).
on:
  push:
    branches:
      - claude/toast-pos-weekly-reports-nft91i
  schedule:
    # Rebuild every 4 hours so the current-week (running, includes today) boards
    # stay fresh through the day.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      weeks:
        description: "Number of trailing weeks to report"
        required: false
        default: "8"

permissions:
  contents: read

concurrency:
  # Only one deploy at a time; a newer run supersedes an older queued one.
  group: "deploy-fishshops"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Guards the Cloudflare deploy step: it only runs once this secret is set.
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate reports
        env:
          PYTHONPATH: src
          TOAST_API_HOST: ${{ secrets.TOAST_API_HOST }}
          TOAST_CLIENT_ID: ${{ secrets.TOAST_CLIENT_ID }}
          TOAST_CLIENT_SECRET: ${{ secrets.TOAST_CLIENT_SECRET }}
          TOAST_USER_ACCESS_TYPE: ${{ secrets.TOAST_USER_ACCESS_TYPE }}
          TOAST_RESTAURANT_GUIDS: ${{ secrets.TOAST_RESTAURANT_GUIDS }}
        run: |
          python -m toast_reports --weeks "${{ github.event.inputs.weeks || '8' }}" --output-dir output

      - name: Upload workbook artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-xlsx
          path: output/*.xlsx

      # Deploy to Cloudflare Pages (private — gated by Cloudflare Access).
      # Creates the Direct Upload project on first run, then deploys to it.
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create fishshops-labor \
            --production-branch=main || true
          npx --yes wrangler@3 pages deploy output \
            --project-name=fishshops-labor --branch=main --commit-dirty=true
