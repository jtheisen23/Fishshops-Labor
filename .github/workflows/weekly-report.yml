name: Weekly Toast Report

# Runs every Monday at 13:00 UTC (adjust to your timezone), on every push to the
# default branch, and on demand.
on:
  push:
    branches:
      - claude/toast-pos-weekly-reports-nft91i
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      weeks:
        description: "Number of trailing weeks to report"
        required: false
        default: "4"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Guards the Cloudflare deploy step: it only runs once this secret is set.
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate reports
        env:
          PYTHONPATH: src
          TOAST_API_HOST: ${{ secrets.TOAST_API_HOST }}
          TOAST_CLIENT_ID: ${{ secrets.TOAST_CLIENT_ID }}
          TOAST_CLIENT_SECRET: ${{ secrets.TOAST_CLIENT_SECRET }}
          TOAST_USER_ACCESS_TYPE: ${{ secrets.TOAST_USER_ACCESS_TYPE }}
          TOAST_RESTAURANT_GUIDS: ${{ secrets.TOAST_RESTAURANT_GUIDS }}
        run: |
          python -m toast_reports --weeks "${{ github.event.inputs.weeks || '4' }}" --output-dir output

      - name: Upload workbook artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-xlsx
          path: output/*.xlsx

      # --- Private hosting: Cloudflare Pages (protected by Cloudflare Access) ---
      # Runs only once CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets exist.
      # Create a Pages project named "fishshops-labor" (Direct Upload) first.
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy output --project-name=fishshops-labor --branch=main

      # --- PUBLIC hosting: GitHub Pages. Disable this once Cloudflare Access is
      #     confirmed working (Settings -> Pages -> Source: None), then remove
      #     the upload step + deploy-pages job below. ---
      - name: Upload Pages artifact (HTML dashboard)
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
