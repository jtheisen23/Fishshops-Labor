# Location config for this deployment.
#
# `guid` is the Toast restaurant external ID (an identifier, not a secret — it
# already appears in the API request headers and build logs). `name` is the
# display label used across the dashboard and Excel; it is authoritative and is
# NOT overwritten by Toast's own restaurant name (which is the street address).
locations:
  - name: "Pacific Beach"        # 1775 Garnet Ave
    guid: "84e6d721-e845-4e99-8a6a-fa350b98f722"
    timezone: "America/Los_Angeles"
  - name: "Encinitas"            # 1010 S Coast Hwy 101
    guid: "3b392333-297b-4bbb-9b6e-f75e3bf646b1"
    timezone: "America/Los_Angeles"
  - name: "Point Loma"           # 1110 Rosecrans St Ste 100
    guid: "f2a38d2f-d4b4-4cb9-94ba-3afcbb675298"
    timezone: "America/Los_Angeles"
  - name: "Oceanside"            # Fish Shop Oceanside
    guid: "0b167cf2-bb37-403a-ba8c-e1df68e9542e"
    timezone: "America/Los_Angeles"

report:
  week_start: "monday"
  output_dir: "output"
  title: "Weekly Labor & Sales Report"
  # Job titles (case-insensitive) excluded from ALL labor figures, so they never
  # count toward hours / labor % / SPLH anywhere.
  #   - "Register": a POS role, not real labor.
  #   - "General Manager": salaried, excluded from hourly labor.
  #   - "Chef": excluded from hourly labor.
  exclude_roles:
    - "Register"
    - "General Manager"
    - "Chef"

  # Toast sales-category names -> Food / Alcohol, for the food-vs-alcohol split
  # by revenue center. Leave empty to use the built-in defaults (Food / Liquor /
  # Beer / Wine and friends) plus keyword matching. Every run logs each category
  # it found and the bucket it landed in — pin anything the keywords read wrong:
  #
  #   sales_category_groups:
  #     Alcohol: ["Liquor", "Beer", "Wine"]
  #     Food:    ["Food", "Beer Cheese Bites"]   # "Beer ..." would read as booze
  #
  # Pinned from the categories the live run actually found across the four
  # shops, so the mix never depends on a keyword guess. "HH ..." is happy hour;
  # "Draft" is draft beer (Bottle Beer is its own category).
  # Everything not listed falls to Other: N/A Beverage, NA Beverage, Market,
  # Seasoning, Retail, Delivery, Donation — and "Online" at Encinitas, which is
  # a channel bucket rather than a food/drink one, so its contents can't be
  # split (see the note in README).
  sales_category_groups:
    Alcohol:
      - "Draft"
      - "Draft Beer"
      - "HH Draft"
      - "Bottle Beer"
      - "Bottled Beer"
      - "Liquor"
      - "HH Liquor"
      - "Wine"
      - "HH Wine"
      - "Specialty Cocktails"
      - "HH Specialty Cocktails"
    Food:
      - "Food"
      - "Online Food"
      - "D Food"
      - "Appetizers"
      - "Desserts"
