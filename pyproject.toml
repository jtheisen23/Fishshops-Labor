[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toast-reports"
version = "0.1.0"
description = "Pull Toast POS data and build weekly labor & sales reports by location."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "openpyxl>=3.1,<4",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
toast-reports = "toast_reports.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
